# TLS front door for the operator console + API. Template: replace server_name, certificate paths, and the web root.
# Not tested on the author's machine. Terminate your institution's SSO here (auth_request / oauth2-proxy) if you can,
# and let it inject "Authorization: Bearer <operator key>" so keys never sit in browsers.
server {
    listen 80;
    server_name awaaz.example.gov.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name awaaz.example.gov.in;

    ssl_certificate     /etc/ssl/awaaz/fullchain.pem;
    ssl_certificate_key /etc/ssl/awaaz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    # microphone is needed by the console only if browser-mic mode is used; telephony ingest does not need it
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss://$host; img-src 'self' data:; frame-ancestors 'none'" always;

    client_max_body_size 26m;

    location /api/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3700s;     # live calls are long-lived sockets
        proxy_buffering off;
    }

    location / {
        root /var/www/awaaz;          # contents of web/dist after `npm run build`
        try_files $uri /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
